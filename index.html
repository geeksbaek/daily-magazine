<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="GEEK/DAILY — 매일 아침 6시, 개발자를 위한 테크 일간지" />
    <meta name="color-scheme" content="light dark" />
    <title>GEEK/DAILY</title>
    <script>
      (function () {
        try {
          var q = new URLSearchParams(location.search).get('theme');
          var s = q === 'light' || q === 'dark' || q === 'system' ? q : localStorage.getItem('gd-theme-v3');
          var dark = s === 'dark' || ((s === null || s === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
          var dq = new URLSearchParams(location.search).get('design');
          var ok = ['reader'];
          var ds = dq && ok.indexOf(dq) >= 0 ? dq : localStorage.getItem('gd-design-v1');
          document.documentElement.dataset.design = ok.indexOf(ds) >= 0 ? ds : 'reader';
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@300..900&display=swap"
      rel="stylesheet"
    />
    <script>
      // iOS Safari ignores user-scalable=no: cancel pinch gestures explicitly
      ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (t) {
        document.addEventListener(t, function (e) { e.preventDefault(); }, { passive: false });
      });
      document.addEventListener('touchmove', function (e) {
        if (e.touches.length > 1) e.preventDefault();
      }, { passive: false });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
