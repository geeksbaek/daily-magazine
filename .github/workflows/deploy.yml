name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Validate latest issue (exclusivity, history, schema)
        run: |
          LATEST=$(python3 -c "import json; print(json.load(open('public/data/index.json'))['issues'][0]['date'])")
          # issues before the v2 pipeline (2026-09-23) were produced without these guarantees
          if [[ "$LATEST" < "2026-09-23" ]]; then echo "skip: $LATEST predates pipeline v2"; exit 0; fi
          python3 scripts/validate.py "public/data/$LATEST/magazine.json" --ci

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
